name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          # Next.js imports server route modules while collecting build metadata.
          # Prisma needs a valid URL to construct its adapter, but does not connect.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/engagement_tools_ci
          NEXT_TELEMETRY_DISABLED: 1
